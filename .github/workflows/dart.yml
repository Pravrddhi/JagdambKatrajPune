name: Branch Promotion

on:
  push:
    branches:
      - develop
      - pre-release
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to promote from
        required: true
        default: develop
      target_branch:
        description: Target branch to promote into
        required: true
        default: pre-release

permissions:
  contents: read
  pull-requests: write

jobs:
  promote-develop-to-pre-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR develop -> pre-release exists
        env:
          GH_TOKEN: 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
        run: |
          set -euo pipefail

          existing_pr_count=$(gh pr list \
            --base pre-release \
            --head develop \
            --state open \
            --json number \
            --jq 'length')

          if [ "$existing_pr_count" -gt 0 ]; then
            echo "Open PR already exists for develop -> pre-release"
            exit 0
          fi

          gh pr create \
            --base pre-release \
            --head develop \
            --title "Promote develop to pre-release" \
            --body "Automated promotion PR from develop to pre-release."

  promote-pre-release-to-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-release'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR pre-release -> master exists
        env:
          GH_TOKEN: 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
        run: |
          set -euo pipefail

          existing_pr_count=$(gh pr list \
            --base master \
            --head pre-release \
            --state open \
            --json number \
            --jq 'length')

          if [ "$existing_pr_count" -gt 0 ]; then
            echo "Open PR already exists for pre-release -> master"
            exit 0
          fi

          gh pr create \
            --base master \
            --head pre-release \
            --title "Promote pre-release to master" \
            --body "Automated promotion PR from pre-release to master."

  manual-promotion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure manual promotion PR exists
        env:
          GH_TOKEN: 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
          SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          set -euo pipefail

          existing_pr_count=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$existing_pr_count" -gt 0 ]; then
            echo "Open PR already exists for $SOURCE_BRANCH -> $TARGET_BRANCH"
            exit 0
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "Promote $SOURCE_BRANCH to $TARGET_BRANCH" \
            --body "Automated promotion PR from $SOURCE_BRANCH to $TARGET_BRANCH."
